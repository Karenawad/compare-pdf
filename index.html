<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>مقارنة PDF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>مقارنة نسختين PDF</h1><p>اختار النسخة القديمة والجديدة وهقولك فيه تعديل ولا لأ</p></header>

<main>
  <section class="pick">
    <label class="file" id="lblOld"><span class="tag old">القديمة</span><span class="name" id="nameOld">اضغط لاختيار الملف القديم</span>
      <input type="file" id="fileOld" accept="application/pdf,.pdf"></label>
    <label class="file" id="lblNew"><span class="tag new">الجديدة</span><span class="name" id="nameNew">اضغط لاختيار الملف الجديد</span>
      <input type="file" id="fileNew" accept="application/pdf,.pdf"></label>
    <div class="opts">
      <div class="ot">الصفحات</div>
      <label class="chk"><input type="radio" name="rng" value="all" checked> كل الصفحات</label>
      <label class="chk"><input type="radio" name="rng" value="custom"> صفحات محددة</label>
      <input id="rngTxt" type="text" inputmode="numeric" placeholder="مثال: 1-3,5,8" disabled>
    </div>
    <button id="go" disabled>قارن</button>
    <div id="progress" hidden><div id="bar"></div><span id="ptext"></span></div>
  </section>

  <section id="result" hidden>
    <div id="verdict"></div>
    <div id="groups"></div>
    <p class="hint">دوس على رقم الصفحة لعرض التفاصيل</p>
  </section>
</main>

<div id="viewer" hidden>
  <div class="vbar"><button id="vclose">إغلاق ✕</button><span id="vtitle"></span></div>
  <div class="tabs">
    <button data-m="diff" class="on">الفروق</button>
    <button data-m="old">القديمة</button>
    <button data-m="new">الجديدة</button>
  </div>
  <div class="vbody"><canvas id="vcanvas"></canvas></div>
  <div id="vtext"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
